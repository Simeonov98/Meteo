[project]
name = "meteo"
version = "2.0.0"
description = "Scrapes multi-day weather forecasts from Bulgarian weather sites to later measure forecast accuracy over time"
requires-python = ">=3.9"
dependencies = [
    "selenium>=4.20",
#    "webdriver-manager>=4.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
meteo = "meteo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meteo"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
